<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101a2e">
<title>Disaster Mayor</title>
<meta name="description" content="You are the mayor. Everything is on fire. Also there are llamas.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <h1 class="sr-only">Disaster Mayor</h1>

  <!-- ======= CITY CANVAS ======= -->
  <main id="stage" aria-label="City map">
    <canvas id="city" tabindex="0" role="img" aria-roledescription="city map"
      aria-label="City map of Port Fiasco. Loading."></canvas>

    <!-- floating tile info popup (visual aid; the same info is in dialogs) -->
    <div id="tile-popup" class="popup hidden" role="dialog" aria-label="Building information"></div>

    <!-- news ticker: visual only — live regions handle screen reader output -->
    <div id="ticker" class="ticker hidden" aria-hidden="true"></div>
  </main>

  <!-- ======= HUD (top bar) ======= -->
  <header id="hud" class="hidden" aria-label="Game status and controls">
    <nav class="hud-left" aria-label="Game controls">
      <button id="btn-pause-menu" class="icon-btn" aria-label="Game menu">☰</button>
      <div class="day-chip" id="day-chip" aria-hidden="true">
        <span id="hud-day">Day 1</span>
        <span id="hud-clock" class="clock">☀️</span>
      </div>
      <button id="btn-pause" class="icon-btn" aria-label="Pause game" aria-pressed="false">⏸</button>
      <button id="btn-speed" class="icon-btn" aria-label="Game speed: normal">1×</button>
    </nav>
    <!-- visual stat meters; screen readers use the City Status command instead -->
    <div class="hud-stats" aria-hidden="true">
      <div class="stat" id="stat-population" title="Population">
        <span class="stat-ico">👥</span><span class="stat-num" id="num-population">0</span>
      </div>
      <div class="stat" id="stat-budget" title="City budget">
        <span class="stat-ico">💰</span><span class="stat-num" id="num-budget">$0</span>
      </div>
      <div class="stat meter" id="stat-happiness" title="Happiness">
        <span class="stat-ico">😊</span><span class="bar"><span class="fill" id="bar-happiness"></span></span>
      </div>
      <div class="stat meter" id="stat-safety" title="Safety">
        <span class="stat-ico">🛡️</span><span class="bar"><span class="fill" id="bar-safety"></span></span>
      </div>
      <div class="stat meter" id="stat-infrastructure" title="Infrastructure">
        <span class="stat-ico">🏗️</span><span class="bar"><span class="fill" id="bar-infrastructure"></span></span>
      </div>
      <div class="stat meter chaos" id="stat-chaos" title="Chaos — if this fills up, it's over">
        <span class="stat-ico">🌪️</span><span class="bar"><span class="fill" id="bar-chaos"></span></span>
      </div>
    </div>
  </header>

  <!-- ======= SIDE PANEL ======= -->
  <div id="panel" class="hidden">
    <!-- quick command bar: one-stop shortcuts that keep VoiceOver swiping short -->
    <nav id="commands" class="commands" aria-label="Quick commands">
      <button id="cmd-status" class="cmd-btn" aria-label="City status. Hear a summary of stats, incidents and available crews. Shortcut C.">📊<span>Status</span></button>
      <button id="cmd-incidents" class="cmd-btn" aria-label="Go to active incidents. Shortcut I.">🚨<span>Incidents</span></button>
      <button id="cmd-services" class="cmd-btn" aria-label="Go to emergency services. Shortcut S.">🚒<span>Services</span></button>
      <button id="cmd-desk" class="cmd-btn" aria-label="Go to the Mayor's Desk. Shortcut M.">🎩<span>Desk</span></button>
    </nav>

    <section id="incidents-section" aria-labelledby="incidents-heading">
      <div class="panel-head">
        <h2 id="incidents-heading" tabindex="-1">🚨 Incidents</h2>
        <span id="incident-count" class="count-pill" aria-hidden="true">0</span>
      </div>
      <div id="incident-list" class="incident-list" role="list">
        <p id="all-clear" class="all-clear">All quiet. Suspiciously quiet…</p>
      </div>
    </section>

    <section id="services-section" aria-labelledby="services-heading">
      <h2 id="services-heading" class="section-h">🚑 Emergency Services</h2>
      <div id="services" class="services" tabindex="0" role="group"
        aria-label="Emergency services status loading"></div>
    </section>

    <section id="desk-section" class="desk" aria-labelledby="desk-heading">
      <h2 id="desk-heading" class="section-h">🎩 Mayor's Desk</h2>
      <div id="desk-actions" class="desk-actions"></div>
    </section>
  </div>

  <!-- ======= MAIN MENU ======= -->
  <div id="menu" class="screen" role="dialog" aria-label="Main menu">
    <div class="menu-card">
      <div class="logo" aria-hidden="true">
        <span class="logo-top">DISASTER</span>
        <span class="logo-bottom">MAYOR</span>
        <span class="logo-emoji">🔥🏙️🦙</span>
      </div>
      <p class="tagline">Keep the city alive. Ish.</p>
      <nav class="menu-buttons" aria-label="Main menu">
        <button id="btn-new" class="menu-btn primary">🏁 New Game</button>
        <button id="btn-continue" class="menu-btn" disabled>▶️ Continue</button>
        <button id="btn-howto" class="menu-btn">📖 How to Play</button>
        <button id="btn-settings" class="menu-btn">⚙️ Settings</button>
        <button id="btn-credits" class="menu-btn">🏆 Credits</button>
      </nav>
      <p class="menu-foot" id="menu-best"></p>
    </div>
  </div>

  <!-- ======= MODALS ======= -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title" tabindex="-1">Title</h2>
        <button id="modal-close" class="icon-btn" aria-label="Close dialog">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ======= LIVE REGIONS (screen reader announcements) ======= -->
  <div id="announce-polite" class="sr-only" aria-live="polite"></div>
  <div id="announce-assertive" class="sr-only" aria-live="assertive" role="alert"></div>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
