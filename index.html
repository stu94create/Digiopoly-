// BUY MODAL
// ============================================================

function showBuyModal(p, space) {
  const canBuy = p.money >= space.price;
  const hasInfo = !!INFO[space.name];
  const actions = [
    { text: 'Buy', primary: true, disabled: !canBuy, action: () => buyProperty(p, space) },
    { text: 'Decline', action: () => declineProperty(p, space) },
  ];
  if (hasInfo) {
    actions.push({ text: 'About ' + space.name, action: () => showInfoModal(space, () => showBuyModal(p, space)) });
  }
  openModal({
    title: 'Buy ' + space.name + '?',
    body: `
      <p>${escapeHtml(space.name)} is unowned.</p>
      <p><strong>Price:</strong> ${fmtMoney(space.price)}</p>
      <p><strong>Your cash:</strong> ${fmtMoney(p.money)}</p>
      ${space.type === 'property' ? `<p class="muted">Site rent ${fmtMoney(space.rent[0])}, full set doubles it.</p>` : ''}
    `,
    actions: actions
  });
}

function showInfoModal(space, onBack) {
  const info = INFO[space.name] || 'No description available.';
  openModal({
    title: 'About ' + space.name,
    body: '<p>' + escapeHtml(info) + '</p>',
    actions: [
      { text: onBack ? 'Back' : 'Close', action: onBack || closeModal }
    ]
  });
}

function buyProperty(p, space) {
  p.money -= space.price;
  p.properties.push(p.position);
  sfxBuy();
  announce(p.name + ' bought ' + space.name + ' for ' + fmtMoney(space.price) + '.');
  closeModal();
  if (p.money < 0) checkBankruptcy(p, null);
  state.turnPhase = 'action';
  renderGame();
  saveGame();
  setTimeout(continueAfterAction, pace());
}

function declineProperty(p, space) {
  announce(p.name + ' declined to buy ' + space.name + '.');
  closeModal();
  if (state.houseRules.auctions) {
    setTimeout(() => startAuction(p, space), pace());
    return;
  }
  state.turnPhase = 'action';
  renderGame();
  saveGame();
  setTimeout(continueAfterAction, pace());
}

// ============================================================
// AUCTIONS
// ============================================================

// When a property is declined, all non-bankrupt players (including the
// one who declined) may bid. Sequential ascending auction: rotate through
// bidders, each can raise or pass. Last bidder standing wins at their bid.
// If nobody bids, the property stays with the bank.
function startAuction(lander, space) {
  if (!stateAlive()) return;
  const pos = space.pos;
  // Rotate bidders so the player to the lander's left goes first
  const live = state.players.filter(x => !x.bankrupt);
  const landerIdx = live.findIndex(x => x.id === lander.id);
  const ordered = live.slice(landerIdx + 1).concat(live.slice(0, landerIdx + 1));
  state._auction = {
    pos: pos,
    highBid: 0,
    highBidderId: null,
    activeBidderIds: ordered.map(x => x.id),
    currentIdx: 0,
    landerId: lander.id
  };
  announce('Auction opens on ' + space.name + '. Starting bid €1.');
  setTimeout(runAuctionTurn, 600);
}

function runAuctionTurn() {
  if (!stateAlive()) return;
  const a = state._auction;
  if (!a) return;
  // Auction ends when only one active bidder remains (and they've made at
  // least one bid — i.e. they hold the high bid). Otherwise everyone has
  // passed without bidding.
  if (a.activeBidderIds.length === 0) return finishAuction();
  if (a.activeBidderIds.length === 1 && a.highBidderId === a.activeBidderIds[0]) {
    return finishAuction();
  }

  // Wrap currentIdx
  if (a.currentIdx >= a.activeBidderIds.length) a.currentIdx = 0;
  const bidderId = a.activeBidderIds[a.currentIdx];
  const bidder = state.players.find(x => x.id === bidderId);
  if (!bidder) {
    a.activeBidderIds.splice(a.currentIdx, 1);
    return runAuctionTurn();
  }

  if (bidder.isAI) {
    setTimeout(() => aiAuctionTurn(bidder), 700);
  } else {
    showBidModal(bidder);
  }
}

function showBidModal(bidder) {
  const a = state._auction;
  const space = BOARD[a.pos];
  const highBidderName = a.highBidderId != null
    ? state.players.find(x => x.id === a.highBidderId).name
    : 'nobody';
  const minNextBid = a.highBid + 1;
  const remaining = a.activeBidderIds.length;

  const body = `
    <p><strong>${escapeHtml(space.name)}</strong> — list price ${fmtMoney(space.price)}.</p>
    <p>Current high bid: <strong>${fmtMoney(a.highBid)}</strong> (${escapeHtml(highBidderName)})</p>
    <p>Your cash: ${fmtMoney(bidder.money)}. Bidders still in: ${remaining}.</p>
    <div class="trade-input-row">
      <label for="bid-amount">Custom bid (€):</label>
      <input type="number" id="bid-amount" min="${minNextBid}" max="${bidder.money}" value="${minNextBid}">
    </div>
  `;

  const quick = [10, 50, 100];
  const actions = [];
  for (const inc of quick) {
    const next = a.highBid + inc;
    if (next <= bidder.money) {
      actions.push({ text: '+' + fmtMoney(inc) + ' (bid ' + fmtMoney(next) + ')', action: () => placeBid(bidder.id, next) });
    }
  }
  actions.push({ text: 'Bid custom amount', primary: true, action: () => {
    const val = parseInt(document.getElementById('bid-amount').value, 10) || 0;
    placeBid(bidder.id, val);
  }});
  actions.push({ text: 'Pass', action: () => passBid(bidder.id) });

  openModal({
    title: 'Auction: ' + space.name,
    body: body,
    actions: actions
  });
}

function placeBid(bidderId, amount) {
  const a = state._auction;
  const bidder = state.players.find(x => x.id === bidderId);
  if (!a || !bidder) return;
  if (amount <= a.highBid) {
    announce('Bid must beat ' + fmtMoney(a.highBid) + '.');
    return;
  }
  if (amount > bidder.money) {
    announce(bidder.name + ' only has ' + fmtMoney(bidder.money) + '.');
    return;
  }
  a.highBid = amount;
  a.highBidderId = bidderId;
  announce(bidder.name + ' bid ' + fmtMoney(amount) + '.');
  closeModal();
  a.currentIdx++;
  setTimeout(runAuctionTurn, 500);
}

function passBid(bidderId) {
  const a = state._auction;
  if (!a) return;
  const bidder = state.players.find(x => x.id === bidderId);
  announce((bidder ? bidder.name : 'Player') + ' passes.');
  // Remove from active bidders; keep currentIdx pointing at next bidder
  const idx = a.activeBidderIds.indexOf(bidderId);
  if (idx >= 0) a.activeBidderIds.splice(idx, 1);
  // If currentIdx was at or after removed, it now points at next; clamp
  if (a.currentIdx >= a.activeBidderIds.length) a.currentIdx = 0;
  closeModal();
  setTimeout(runAuctionTurn, 400);
}

function aiAuctionTurn(ai) {
  if (!stateAlive()) return;
  const a = state._auction;
  if (!a) return;
  const space = BOARD[a.pos];
  // Max value the AI will pay: based on price and cash reserve.
  // More aggressive if they need the property (would complete a colour set,
  // station set, or utility set).
  const wouldComplete = (() => {
    if (space.type === 'property') {
      const groupOwned = ai.properties.filter(pos => BOARD[pos].group === space.group).length;
      const groupTotal = GROUPS[space.group] ? GROUPS[space.group].length : 0;
      return groupTotal > 0 && groupOwned === groupTotal - 1;
    }
    if (space.type === 'station') {
      return STATIONS.filter(s => ai.properties.includes(s)).length === STATIONS.length - 1;
    }
    if (space.type === 'utility') {
      return UTILITIES.filter(u => ai.properties.includes(u)).length === UTILITIES.length - 1;
    }
    return false;
  })();
  let maxPay = Math.floor(space.price * (wouldComplete ? 1.4 : 0.9));
  // Cap at half the AI's cash so it doesn't ruin itself
  maxPay = Math.min(maxPay, Math.floor(ai.money * 0.5));
  // Small jitter
  maxPay += Math.floor((Math.random() - 0.5) * 30);
  // Hard cap at the AI's actual cash — otherwise placeBid will reject the
  // bid and the auction wedges (placeBid doesn't advance currentIdx on failure).
  maxPay = Math.min(maxPay, ai.money);

  if (a.highBid >= maxPay) {
    passBid(ai.id);
    return;
  }
  // Bid the smallest increment above current high
  const inc = a.highBid === 0 ? 10 : Math.max(5, Math.floor(a.highBid * 0.1));
  const bid = Math.min(a.highBid + inc, maxPay);
  if (bid <= a.highBid || bid > ai.money) {
    passBid(ai.id);
    return;
  }
  placeBid(ai.id, bid);
}

function finishAuction() {
  if (!stateAlive()) return;
  const a = state._auction;
  if (!a) return;
  const space = BOARD[a.pos];
  if (a.highBidderId != null && a.highBid > 0) {
    const winner = state.players.find(x => x.id === a.highBidderId);
    if (winner && !winner.bankrupt) {
      winner.money -= a.highBid;
      winner.properties.push(a.pos);
      sfxBuy();
      announce(winner.name + ' won ' + space.name + ' at auction for ' + fmtMoney(a.highBid) + '.');
      if (winner.money < 0) checkBankruptcy(winner, null);
    } else {
      announce(space.name + ' received no valid bids and stays unowned.');
    }
  } else {
    announce(space.name + ' received no bids and stays unowned.');
  }
  state._auction = null;
  state.turnPhase = 'action';
  renderGame();
  saveGame();
  setTimeout(continueAfterAction, pace());
}

// ============================================================
// CARDS
// ============================================================

function drawCard(deckName, p) {
  const deck = deckName === 'chance' ? state.chanceDeck : state.chestDeck;
  const idxKey = deckName === 'chance' ? 'chanceIdx' : 'chestIdx';
  const card = deck[state[idxKey] % deck.length];
  state[idxKey]++;
  sfxCard();
  announce(p.name + ' draws ' + (deckName === 'chance' ? 'Chance' : 'Community Chest') + ': ' + card.text);
  setTimeout(() => applyCardEffect(p, card), pace());
}

function applyCardEffect(p, card, opts) {
  if (!stateAlive()) return;
  const e = card.effect;
  const suppressContinue = !!(opts && opts.suppressContinue);
  switch (e.type) {
    case 'GOTO': {
      if (e.pos < p.position) {
        // Passing GO
        if (e.skipSalary) {
          announce(p.name + ' rushed past GO without collecting.');
        } else {
          const salary = state.houseRules.doubleOnGo && e.pos === 0 ? GO_SALARY * 2 : GO_SALARY;
          p.money += salary;
          announce(p.name + ' passed GO — collected ' + fmtMoney(salary) + '.');
          sfxPassGo();
        }
      }
      p.position = e.pos;
      // Re-roll dice if landing on a utility so rent isn't computed from the
      // pre-card roll. Monopoly rule: utility rent = dice × multiplier.
      if (BOARD[e.pos] && BOARD[e.pos].type === 'utility') {
        state.dice = [rollDie(), rollDie()];
        renderDice();
      }
      renderGame();
      setTimeout(() => landOnSpace(p), pace());
      return;
    }
    case 'GOTO_NEAREST_STATION': {
      const next = STATIONS.find(s => s > p.position) || STATIONS[0];
      if (next < p.position) {
        if (e.skipSalary) {
          announce(p.name + ' rushed past GO without collecting.');
        } else {
          p.money += GO_SALARY;
          announce(p.name + ' passed GO.');
          sfxPassGo();
        }
      }
      p.position = next;
      state._pendingRentMultiplier = true;
      renderGame();
      setTimeout(() => landOnSpace(p), pace());
      return;
    }
    case 'GOTO_NEAREST_UTILITY': {
      const next = UTILITIES.find(u => u > p.position) || UTILITIES[0];
      if (next < p.position) {
        if (e.skipSalary) {
          announce(p.name + ' rushed past GO without collecting.');
        } else {
          p.money += GO_SALARY;
          announce(p.name + ' passed GO.');
          sfxPassGo();
        }
      }
      p.position = next;
      state._pendingUtilityTenTimes = true;
      // Re-roll dice for utility calc
      state.dice = [rollDie(), rollDie()];
      renderDice();
      renderGame();
      setTimeout(() => landOnSpace(p), pace());
      return;
    }
    case 'COLLECT': {
      p.money += e.amount;
      sfxMoneyIn();
      announce(p.name + ' collected ' + fmtMoney(e.amount) + '.');
      break;
    }
    case 'PAY': {
      p.money -= e.amount;
      if (state.houseRules.freeParkingJackpot) state.freeParkingPot += e.amount;
      sfxMoneyOut();
      announce(p.name + ' paid ' + fmtMoney(e.amount) + '.');
      checkBankruptcy(p, null);
      break;
    }
    case 'GET_OUT': {
      p.getOutCards++;
      announce(p.name + ' got a Get Out of The Pity Corner card.');
      break;
    }
    case 'GO_TO_JAIL': {
      sendToJail(p);
      break;
    }
    case 'BACK_3': {
      p.position = (p.position - 3 + 40) % 40;
      // Re-roll dice if landing on a utility (see GOTO above).
      if (BOARD[p.position] && BOARD[p.position].type === 'utility') {
        state.dice = [rollDie(), rollDie()];
        renderDice();
      }
      renderGame();
      setTimeout(() => landOnSpace(p), pace());
      return;
    }
    case 'PAY_EACH': {
      const others = state.players.filter(x => !x.bankrupt && x.id !== p.id);
      const total = others.length * e.amount;
      for (const o of others) o.money += e.amount;
      p.money -= total;
      announce(p.name + ' paid each player ' + fmtMoney(e.amount) + ' (total ' + fmtMoney(total) + ').');
      sfxMoneyOut();
      checkBankruptcy(p, null);
      break;
    }
    case 'COLLECT_EACH': {
      const others = state.players.filter(x => !x.bankrupt && x.id !== p.id);
      let total = 0;
      for (const o of others) {
        o.money -= e.amount;
        total += e.amount;
      }
      p.money += total;
      sfxMoneyIn();
      announce(p.name + ' collected ' + fmtMoney(e.amount) + ' from each player (total ' + fmtMoney(total) + ').');
      for (const o of others) {
        if (o.money < 0) checkBankruptcy(o, p);
      }
      break;
    }
    case 'COLLECT_NEXT': {
      // Collect a fixed amount from the next non-bankrupt player in turn order.
      const idx = state.currentIdx;
      let next = (idx + 1) % state.players.length;
      while (state.players[next].bankrupt && next !== idx) {
        next = (next + 1) % state.players.length;
      }
      if (next === idx) {
        announce('No one to collect from.');
        break;
      }
      const target = state.players[next];
      const owed = e.amount || 0;
      const give = Math.min(target.money, owed);
      target.money -= give;
      p.money += give;
      sfxMoneyIn();
      announce(p.name + ' collected ' + fmtMoney(give) + ' from ' + target.name + '.');
      if (target.money <= 0) checkBankruptcy(target, p);
      break;
    }
    case 'NEXT_GO_BONUS': {
      // Multiplier applies to the player's next pass over GO (then clears).
      const mult = e.multiplier || 2;
      p.nextGoMultiplier = mult;
      announce(p.name + ' has a bonus payment waiting — next pass over GO pays ' + (mult === 2 ? 'double' : (mult + ' times normal')) + '.');
      break;
    }
    case 'CHOICE': {
      // Card offers the player two or more options. Each option carries its own effect.
      const opts = e.options || [];
      if (opts.length === 0) break;
      if (p.isAI) {
        const pick = aiPickChoice(p, opts);
        announce(p.name + ' chose: ' + pick.label);
        // Defer so the choice announcement is heard before the consequence
        setTimeout(() => applyCardEffect(p, { effect: pick.effect }), pace());
        return;
      }
      openModal({
        title: 'Choose your move',
        body: '<p>' + escapeHtml(card.text || '') + '</p>',
        actions: opts.map(opt => ({
          text: opt.label,
          action: () => {
            closeModal();
            announce(p.name + ' chose: ' + opt.label);
            setTimeout(() => applyCardEffect(p, { effect: opt.effect }), 250);
          }
        }))
      });
      return; // wait for player choice — do not fall through to continueAfterAction
    }
    case 'SEQUENCE': {
      // Run a list of effects in order. Each step gets its own announcement,
      // queued so VoiceOver hears them in sequence. Any movement effect
      // (GOTO/BACK_3/GO_TO_JAIL/GOTO_NEAREST_*) MUST be the last step,
      // because movement effects handle their own continuation.
      const steps = e.steps || [];
      if (steps.length === 0) break;
      let i = 0;
      function runStep() {
        if (i >= steps.length) return;
        const sub = steps[i];
        const isLast = i === steps.length - 1;
        i++;
        if (isLast) {
          applyCardEffect(p, { effect: sub });
        } else {
          applyCardEffect(p, { effect: sub }, { suppressContinue: true });
          whenAnnouncementsIdle(() => setTimeout(runStep, 300));
        }
      }
      runStep();
      return;
    }
    case 'REPAIRS': {
      let total = 0;
      for (const pos of p.properties) {
        total += (p.houses[pos] || 0) * e.perHouse;
        if (p.hotels[pos]) total += e.perHotel;
      }
      p.money -= total;
      if (state.houseRules.freeParkingJackpot) state.freeParkingPot += total;
      sfxMoneyOut();
      announce(p.name + ' paid repairs: ' + fmtMoney(total) + '.');
      checkBankruptcy(p, null);
      break;
    }
    case 'NO_OP': {
      // Pure flavour card — the joke is that nothing happens.
      break;
    }
    case 'REPOSSESS': {
      // Bank takes the player's most valuable property and pays a fixed amount.
      // Any houses/hotels on it are sold at half cost (added to the payout).
      const amount = e.amount || 100;
      const allOwned = [...p.properties];
      if (allOwned.length === 0) {
        announce(p.name + ' has nothing to repossess. Card has no effect.');
        break;
      }
      // Auto-pick the highest-value property
      let target = allOwned[0];
      let highVal = BOARD[target].price || 0;
      for (const pos of allOwned) {
        const v = BOARD[pos].price || 0;
        if (v > highVal) { target = pos; highVal = v; }
      }
      const space = BOARD[target];
      const houseCost = space.houseCost || 0;
      let buildingsRefund = 0;
      if (p.hotels[target]) {
        buildingsRefund = Math.floor((5 * houseCost) / 2);
        delete p.hotels[target];
      } else if (p.houses[target]) {
        buildingsRefund = Math.floor((p.houses[target] * houseCost) / 2);
        delete p.houses[target];
      }
      p.properties = p.properties.filter(x => x !== target);
      p.mortgaged = p.mortgaged.filter(x => x !== target);
      const total = amount + buildingsRefund;
      p.money += total;
      sfxMoneyOut(); // mournful tone — it's a loss disguised as a payout
      announce('The bank repossessed ' + space.name + ' from ' + p.name + '. Paid ' + fmtMoney(total) + (buildingsRefund ? ' (incl. ' + fmtMoney(buildingsRefund) + ' for buildings)' : '') + '.');
      break;
    }
  }
  if (suppressContinue) return;
  state.turnPhase = 'action';
  renderGame();
  saveGame();
  setTimeout(continueAfterAction, pace());
}

// ============================================================
// JAIL
// ============================================================

function sendToJail(p) {
  p.position = 10;
  p.inJail = true;
  p.jailTurns = 0;
  state.doubleCount = 0;
  sfxJail();
  announce(p.name + ' is sent to The Pity Corner.');
}

function rollForJail() {
  const p = currentPlayer();
  if (!p.inJail) return;
  const d1 = rollDie();
  const d2 = rollDie();
  state.dice = [d1, d2];
  sfxRoll();
  renderDice();
  announce(p.name + ' rolled ' + d1 + ' and ' + d2 + '.');
  if (d1 === d2) {
    p.inJail = false;
    p.jailTurns = 0;
    announce(p.name + ' rolled doubles — out of The Pity Corner.');
    movePlayer(p, d1 + d2);
  } else {
    p.jailTurns++;
    if (p.jailTurns >= 3) {
      announce(p.name + ' has served three turns — must pay the fine.');
      if (p.money >= PITY_CORNER_FINE) {
        p.money -= PITY_CORNER_FINE;
        if (state.houseRules.freeParkingJackpot) state.freeParkingPot += PITY_CORNER_FINE;
        sfxMoneyOut();
        p.inJail = false;
        p.jailTurns = 0;
        movePlayer(p, d1 + d2);
      } else {
        checkBankruptcy(p, null);
        state.turnPhase = 'action';
        renderGame();
        saveGame();
        setTimeout(continueAfterAction, pace());
      }
    } else {
      state.turnPhase = 'action';
      renderGame();
      saveGame();
      setTimeout(continueAfterAction, pace());
    }
  }
}

function payToLeave() {
  const p = currentPlayer();
  if (p.money < PITY_CORNER_FINE) return;
  p.money -= PITY_CORNER_FINE;
  if (state.houseRules.freeParkingJackpot) state.freeParkingPot += PITY_CORNER_FINE;
  sfxMoneyOut();
  p.inJail = false;
  p.jailTurns = 0;
  announce(p.name + ' paid €' + PITY_CORNER_FINE + ' and left The Pity Corner.');
  state.turnPhase = 'roll';
  renderGame();
  saveGame();
}

function useGetOutCard() {
  const p = currentPlayer();
  if (p.getOutCards <= 0) return;
  p.getOutCards--;
  p.inJail = false;
  p.jailTurns = 0;
  announce(p.name + ' used a Get Out card.');
  state.turnPhase = 'roll';
  renderGame();
  saveGame();
}

// ============================================================
// TURN MANAGEMENT
// ============================================================

function continueAfterAction() {
  if (!stateAlive()) return;
  // If a manual rescue modal is open, don't progress the turn until it resolves.
  if (state._awaitingRescue) return;
  // If player rolled doubles and is not in jail, allow another roll
  // (handled in renderActions). Otherwise do nothing — wait for End Turn.
  renderGame();
  if (currentPlayer().isAI && !state.gameOver) {
    aiNext(aiContinue);
  }
}

function endTurn() {
  if (!stateAlive()) return;
  if (state.gameOver) return;
  // Defensive: never spin forever if every player is somehow bankrupt.
  if (alivePlayers().length === 0) { state.gameOver = true; renderGame(); return; }
  state.doubleCount = 0;
  state.dice = [0, 0];
  // Reset per-turn AI flags so the next turn starts fresh
  state.players.forEach(pl => { pl._consideredTradeThisTurn = false; });
  // Advance to next non-bankrupt player
  do {
    state.currentIdx = (state.currentIdx + 1) % state.players.length;
  } while (state.players[state.currentIdx].bankrupt);
  state.turnPhase = 'roll';
  saveGame();
  // Handoff between physical players if there's more than one human in the game.
  const next = currentPlayer();
  const humanCount = state.players.filter(x => !x.isAI && !x.bankrupt).length;
  if (humanCount > 1 && !next.isAI) {
    showHandoffModal(next);
    return;
  }
  announce("It's " + next.name + "'s turn.");
  renderGame();
  if (next.isAI) aiNext(aiTakeTurn);
}

function showHandoffModal(next) {
  // Hide game info momentarily — render the screen but the modal covers it.
  renderGame();
  openModal({
    title: 'Pass the phone',
    body: '<p style="font-size:1.15rem; text-align:center; margin:18px 0;">Hand the phone to</p>' +
          '<p style="font-size:1.8rem; text-align:center; font-family:\'Special Elite\', monospace; color:var(--accent); margin:18px 0;">' + escapeHtml(next.name) + '</p>' +
          '<p style="text-align:center; margin:18px 0;">When ' + escapeHtml(next.name) + ' has the phone, tap below to start their turn.</p>',
    actions: [
      { text: "I'm " + next.name + " — start my turn", primary: true, action: () => {
        closeModal();
        announce("It's " + next.name + "'s turn.");
      }}
    ]
  });
}

// ============================================================
// AI
// ============================================================

function aiTakeTurn() {
  if (!stateAlive()) return;
  const p = currentPlayer();
  if (!p.isAI || state.gameOver) return;
  // Once per turn: consider proposing a trade before rolling.
  if (!p._consideredTradeThisTurn) {
    p._consideredTradeThisTurn = true;
    if (aiConsiderTrade(p)) return; // Trade in flight; resumes via resumeAfterAITrade()
  }
  if (p.inJail) {
    // Strategy: if can afford and not many turns left, pay; otherwise roll
    if (p.getOutCards > 0) {
      useGetOutCard();
      aiNext(aiTakeTurn);
      return;
    }
    if (p.jailTurns < 2 && p.money > 300) {
      // Try rolling first if we have cash buffer
      rollForJail();
      return;
    }
    if (p.money >= PITY_CORNER_FINE) {
      payToLeave();
      aiNext(aiTakeTurn);
      return;
    }
    rollForJail();
    return;
  }
  doDiceRoll();
}

function aiContinue() {
  if (!stateAlive()) return;
  const p = currentPlayer();
  if (!p.isAI || state.gameOver) return;
  if (state.doubleCount > 0 && !p.inJail && state.turnPhase === 'action') {
    aiNext(doDiceRoll);
    return;
  }
  // Maybe build houses
  aiTryBuildHouses(p);
  aiNext(endTurn);
}

function aiTryBuildHouses(p) {
  const reserve = 400;
  if (p.money < reserve + 100) return;
  for (const group in GROUPS) {
    const positions = GROUPS[group];
    if (!positions.every(pos => p.properties.includes(pos) && !p.mortgaged.includes(pos))) continue;
    let housesBuilt = 0;
    let hotelsBuilt = 0;
    while (p.money > reserve) {
      const counts = positions.map(pos => (p.hotels[pos] ? 5 : (p.houses[pos] || 0)));
      const minCount = Math.min(...counts);
      if (minCount >= 5) break;
      const targetIdx = counts.indexOf(minCount);
      const target = positions[targetIdx];
      const space = BOARD[target];
      if (p.money < space.houseCost + reserve) break;
      p.money -= space.houseCost;
      if (minCount === 4) {
        p.hotels[target] = 1;
        p.houses[target] = 0;
        hotelsBuilt++;
      } else {
        p.houses[target] = minCount + 1;
        housesBuilt++;
      }
    }
    if (housesBuilt || hotelsBuilt) {
      const parts = [];
      if (housesBuilt) parts.push(housesBuilt + ' house' + (housesBuilt === 1 ? '' : 's'));
      if (hotelsBuilt) parts.push(hotelsBuilt + ' hotel' + (hotelsBuilt === 1 ? '' : 's'));
      announce(p.name + ' built ' + parts.join(' and ') + ' on the ' + group.replace('-', ' ') + ' set.');
      sfxBuy();
    }
  }
}

function aiDecideBuy(p, space) {
  // Buy if can afford with comfortable reserve
  const reserve = 200;
  if (p.money >= space.price + reserve) {
    buyProperty(p, space);
  } else {
    declineProperty(p, space);
  }
}

// For CHOICE cards: pick whichever option costs the AI least (or pays most).
function aiPickChoice(p, options) {
  let best = options[0];
  let bestCost = estimateEffectCost(p, options[0].effect);
  for (let i = 1; i < options.length; i++) {
    const c = estimateEffectCost(p, options[i].effect);
    if (c < bestCost) { best = options[i]; bestCost = c; }
  }
  return best;
}

function estimateEffectCost(p, effect) {
  if (!effect) return 0;
  switch (effect.type) {
    case 'PAY': return effect.amount || 0;
    case 'COLLECT': return -(effect.amount || 0);
    case 'PAY_EACH': return (effect.amount || 0) * (state.players.filter(x => !x.bankrupt).length - 1);
    case 'COLLECT_EACH': return -(effect.amount || 0) * (state.players.filter(x => !x.bankrupt).length - 1);
    case 'COLLECT_NEXT': return -(effect.amount || 0);
    case 'GO_TO_JAIL': return 100; // arbitrary nuisance value
    case 'GET_OUT': return -50;    // a small asset
    case 'GOTO': {
      const pos = effect.pos;
      const space = BOARD[pos];
      const owner = findOwner(pos);
      // Subtract salary if we'll pass GO going there
      let cost = 0;
      if (pos < p.position) cost -= GO_SALARY;
      if (pos === 0) cost -= GO_SALARY;
      // Add estimated rent if owned by someone else
      if (owner && owner.id !== p.id && !owner.mortgaged.includes(pos)) {
        if (space.type === 'property' && space.rent) cost += space.rent[0];
        else if (space.type === 'station') cost += 25;
        else if (space.type === 'utility') cost += 28; // ~7 * 4
      }
      return cost;
    }
    case 'BACK_3':       return 0;
    case 'NEXT_GO_BONUS': return -(GO_SALARY * ((effect.multiplier || 2) - 1));
    case 'REPAIRS': {
      let total = 0;
      for (const pos of p.properties) {
        total += (p.houses[pos] || 0) * (effect.perHouse || 0);
        if (p.hotels[pos]) total += effect.perHotel || 0;
      }
      return total;
    }
    default: return 0;
  }
}

// ============================================================
// MODAL
// ============================================================

function openModal({ title, body, actions }) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  const a = document.getElementById('modal-actions');
  a.innerHTML = '';
  for (const act of actions || []) {
    const b = document.createElement('button');
    b.className = 'btn' + (act.primary ? ' btn-primary' : '');
    b.textContent = act.text;
    if (act.disabled) b.disabled = true;
    b.onclick = act.action;
    a.appendChild(b);
  }
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.querySelectorAll('.screen').forEach(s => s.setAttribute('inert', ''));
  setTimeout(() => {
    const firstBtn = a.querySelector('button:not([disabled])');
    if (firstBtn) firstBtn.focus();
  }, 50);
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.querySelectorAll('.screen').forEach(s => s.removeAttribute('inert'));
}

// ============================================================
// PORTFOLIO / BOARD / PLAYERS / SETTINGS MODALS
// ============================================================

function openPortfolio() {
  const p = currentPlayer();
  if (p.isAI) {
    openModal({
      title: p.name + "'s Portfolio (AI)",
      body: portfolioHtml(p, false),
      actions: [{ text: 'Close', action: closeModal }]
    });
    return;
  }
  openModal({
    title: 'Your Portfolio',
    body: portfolioHtml(p, true),
    actions: [{ text: 'Close', action: closeModal }]
  });
}

function portfolioHtml(p, interactive) {
  if (p.properties.length === 0) return '<div class="empty">No properties yet.</div>';
  // Group by color
  const byGroup = {};
  for (const pos of p.properties) {
    const space = BOARD[pos];
    const g = space.group || space.type;
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(pos);
  }
  let html = '<div class="props-list">';
  for (const g in byGroup) {
    html += `<h3 style="margin-top:14px;text-transform:capitalize;">${g.replace('-', ' ')}</h3>`;
    for (const pos of byGroup[g]) {
      const space = BOARD[pos];
      const mortgaged = p.mortgaged.includes(pos);
      const houses = p.houses[pos] || 0;
      const hotel = !!p.hotels[pos];
      const ownsFullGroup = space.group && playerOwnsFullGroup(p, space.group);
      html += `<div class="prop-row">
        <div class="top">
          <div><span class="name">${escapeHtml(space.name)}</span>
            ${mortgaged ? '<span class="mortgaged"> (Mortgaged)</span>' : ''}
            ${(houses || hotel) ? ' ' + buildingsBadge(houses, hotel) : ''}
          </div>
          ${INFO[space.name] ? `<button class="btn btn-xs" onclick="openPortfolioAbout(${pos})">About</button>` : ''}
        </div>`;
      if (interactive) {
        html += '<div class="actions">';
        if (!mortgaged && houses === 0 && !hotel) {
          html += `<button class="btn" onclick="actMortgage(${pos})">Mortgage (+${fmtMoney(space.mortgage)})</button>`;
        }
        if (mortgaged) {
          const cost = Math.ceil(space.mortgage * 1.1);
          html += `<button class="btn" onclick="actUnmortgage(${pos})" ${p.money >= cost ? '' : 'disabled'}>Unmortgage (−${fmtMoney(cost)})</button>`;
        }
        if (space.type === 'property' && ownsFullGroup && !mortgaged && !hotel) {
          if (p.money >= space.houseCost && houses < 4) {
            html += `<button class="btn" onclick="actBuildHouse(${pos})">Build house (−${fmtMoney(space.houseCost)})</button>`;
          }
          if (houses === 4 && p.money >= space.houseCost) {
            html += `<button class="btn" onclick="actBuildHotel(${pos})">Build hotel (−${fmtMoney(space.houseCost)})</button>`;
          }
        }
        if (houses > 0 || hotel) {
          html += `<button class="btn" onclick="actSellBuilding(${pos})">Sell ${hotel ? 'hotel' : 'house'} (+${fmtMoney(Math.floor(space.houseCost / 2))})</button>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }
  }
  html += '</div>';
  html += `<p style="margin-top:14px;"><strong>Cash:</strong> ${fmtMoney(p.money)}${p.getOutCards > 0 ? ' · <strong>Get Out cards:</strong> ' + p.getOutCards : ''}</p>`;
  return html;
}

function actMortgage(pos) {
  const p = currentPlayer();
  const space = BOARD[pos];
  if (p.mortgaged.includes(pos)) return;
  if ((p.houses[pos] || 0) > 0 || p.hotels[pos]) return;
  p.money += space.mortgage;
  p.mortgaged.push(pos);
  sfxMoneyIn();
  announce(p.name + ' mortgaged ' + space.name + '.');
  saveGame();
  openPortfolio();
}

function actUnmortgage(pos) {
  const p = currentPlayer();
  const space = BOARD[pos];
  const cost = Math.ceil(space.mortgage * 1.1);
  if (p.money < cost) return;
  p.money -= cost;
  p.mortgaged = p.mortgaged.filter(x => x !== pos);
  sfxMoneyOut();
  announce(p.name + ' unmortgaged ' + space.name + '.');
  saveGame();
  openPortfolio();
}

function actBuildHouse(pos) {
  const p = currentPlayer();
  const space = BOARD[pos];
  if (!playerOwnsFullGroup(p, space.group)) return;
  if (p.mortgaged.includes(pos)) return;
  const houses = p.houses[pos] || 0;
  if (houses >= 4) return;
  // Even build rule: cannot build if another in group has fewer
  const groupCounts = GROUPS[space.group].map(gpos => p.hotels[gpos] ? 5 : (p.houses[gpos] || 0));
  const minCount = Math.min(...groupCounts);
  if (houses > minCount) {
    announce('Even build rule: must build evenly across the set first.');
    openPortfolio();
    return;
  }
  if (p.money < space.houseCost) return;
  p.money -= space.houseCost;
  p.houses[pos] = houses + 1;
  sfxBuy();
  announce(p.name + ' built a house on ' + space.name + '.');
  saveGame();
  openPortfolio();
}

function actBuildHotel(pos) {
  const p = currentPlayer();
  const space = BOARD[pos];
  if (!playerOwnsFullGroup(p, space.group)) return;
  if (p.mortgaged.includes(pos)) return;
  if ((p.houses[pos] || 0) !== 4) return;
  // Even-build rule: every other property in the group must also have 4
  // houses (or a hotel) before this one can be upgraded.
  const groupOk = GROUPS[space.group].every(gpos =>
    p.hotels[gpos] || (p.houses[gpos] || 0) === 4
  );
  if (!groupOk) {
    announce('Even build rule: every property in the set needs 4 houses first.');
    openPortfolio();
    return;
  }
  if (p.money < space.houseCost) return;
  p.money -= space.houseCost;
  p.houses[pos] = 0;
  p.hotels[pos] = 1;
  sfxBuy();
  announce(p.name + ' built a hotel on ' + space.name + '.');
  saveGame();
  openPortfolio();
}

function actSellBuilding(pos) {
  const p = currentPlayer();
  const space = BOARD[pos];
  const refund = Math.floor(space.houseCost / 2);
  if (p.hotels[pos]) {
    p.hotels[pos] = 0;
    delete p.hotels[pos];
    p.houses[pos] = 4;
    announce(p.name + ' sold the hotel on ' + space.name + ' (got 4 houses back).');
  } else if (p.houses[pos] > 0) {
    p.houses[pos]--;
    announce(p.name + ' sold a house on ' + space.name + '.');
  } else return;
  p.money += refund;
  sfxMoneyIn();
  saveGame();
  openPortfolio();
}

function openBoard() {
  openModal({
    title: 'The Board',
    body: boardHtml(),
    actions: [{ text: 'Close', action: closeModal }]
  });
}

function boardHtml() {
  let html = '<div class="board-list">';
  for (const space of BOARD) {
    const owner = isPropertySpace(space.pos) ? findOwner(space.pos) : null;
    const isCurrent = space.pos === currentPlayer().position;
    const bClass = getBoardRowClass(space);
    html += `<div class="board-row${isCurrent ? ' current' : ''} ${bClass}">
      <div><span class="pos">${space.pos.toString().padStart(2, '0')}</span>${escapeHtml(space.name)}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        ${owner ? `<span class="owner-tag">${escapeHtml(owner.name)}</span>` : ''}
        ${INFO[space.name] ? `<button class="btn btn-xs" onclick="openBoardAbout(${space.pos})">About</button>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function openBoardAbout(pos) {
  showInfoModal(BOARD[pos], openBoard);
}

function openPortfolioAbout(pos) {
  showInfoModal(BOARD[pos], openPortfolio);
}

function getBoardRowClass(space) {
  if (space.type === 'property') return 'br-' + space.group;
  if (space.type === 'station') return 'br-station';
  if (space.type === 'utility') return 'br-utility';
  if (space.type === 'chance') return 'br-chance';
  if (space.type === 'chest') return 'br-chest';
  if (space.type === 'corner') return 'br-corner';
  if (space.type === 'tax') return 'br-tax';
  return 'br-corner';
}

function openPlayers() {
  let html = '<div class="props-list">';
  for (const p of state.players) {
    html += `<div class="prop-row">
      <div class="top">
        <div><span class="player-pip piece-pip pip-${p.id}" aria-label="${escapeHtml(pieceFor(p).label)}">${pieceFor(p).emoji}</span><strong>${escapeHtml(p.name)}</strong>${p.isAI ? ' <span class="ai-tag">AI</span>' : ''}${p.bankrupt ? ' (bankrupt)' : ''}</div>
        <div style="font-family:'Courier Prime',monospace;font-weight:700;color:var(--accent);">${fmtMoney(p.money)}</div>
      </div>
      <div class="muted" style="margin-top:4px;">Position: ${escapeHtml(BOARD[p.position].name)}${p.inJail ? ' (in The Pity Corner)' : ''} · ${p.properties.length} ${p.properties.length === 1 ? 'property' : 'properties'}</div>
    </div>`;
  }
  html += '</div>';
  if (state.houseRules.freeParkingJackpot) {
    html += `<p style="margin-top:14px;"><strong>The Busy Spot pot:</strong> ${fmtMoney(state.freeParkingPot)}</p>`;
  }
  openModal({
    title: 'Players',
    body: html,
    actions: [{ text: 'Close', action: closeModal }]
  });
}

    <p>Each lap around the board earns you €254 — the weekly Disability Allowance. Don't spend it all at once.</p>

    <h3>Buying Property</h3>
    <p>Land on an unowned property and you can buy it at the listed price, or decline. If Auctions are on (House Rule), declining sends it to auction — everyone, including you, can bid.</p>

    <h3>Rent and Monopolies</h3>
    <p>Land on someone else's property and you pay them rent. Own every property in a colour group and rent doubles on each unbuilt site. You can then build houses, and eventually a hotel, each one raising the rent.</p>

    <h3>The Pity Corner</h3>
    <p>The jail of this game. You go there if you land on "Go to The Pity Corner", draw a card sending you there, or roll doubles three times in a row.</p>
    <p>To get out, roll doubles (you get three tries), pay the €50 fine, or use a Get Out of The Pity Corner Free card.</p>

    <h3>Cards</h3>
    <p>Two decks: Chance and Community Chest. Land on those spaces to draw one. Some cost money, some pay, some send you places. Each card is themed around the disability sector and Irish life.</p>

    <h3>The Blind Tax</h3>
    <p>Two tax spaces. Pay €100 (Blind Tax) or €200 (Premium Blind Tax) to the bank. If Free Parking jackpot is on, the tax goes into the pot for the next person who lands on The Busy Spot.</p>

    <h3>Trading</h3>
    <p>At any point on your turn, tap "Propose Trade" to offer properties, cash, or Get Out cards to another player. They can accept, counter, or reject. AI players will trade with you too — and may propose trades on their own turns.</p>

    <h3>When You Can't Pay</h3>
    <p>If a rent or tax bill is bigger than your cash, the rescue flow opens. You can sell houses or hotels (at half their build cost), mortgage properties (for half the price), or declare bankruptcy. Turn on Auto-rescue in House Rules if you'd rather have the game handle it.</p>

    <h3>Accessibility</h3>
    <p>The whole game works with VoiceOver. Every ownable space has an "About" button explaining the real-world Irish organisation it represents. Announcements queue with proper timing so multi-step events don't pile up. Sound effects can be toggled at any time.</p>

    <h3>Winning</h3>
    <p>When every other player has gone bankrupt, the game is yours. Good luck.</p>
  `;
  openModal({
    title: 'How to Play',
    body: body,
    actions: [
      { text: onBack ? 'Back to menu' : 'Close', action: onBack || closeModal }
    ]
  });
}

function openSettings() {
  const hr = state.houseRules;
  openModal({
    title: 'Menu',
    body: `
      <h3>House Rules</h3>
      <ul class="house-rules-list">
        <li>Free Parking jackpot: ${hr.freeParkingJackpot ? 'on' : 'off'}</li>
        <li>Double allowance on GO landing: ${hr.doubleOnGo ? 'on' : 'off'}</li>
        <li>Snake eyes bonus: ${hr.snakeEyesBonus ? 'on' : 'off'}</li>
      </ul>
      <p class="muted">House rules are set at game start. Start a new game to change them.</p>
      <div class="checkbox-row">
        <input type="checkbox" id="hr-sound-live" ${hr.sound ? 'checked' : ''} onchange="toggleSound(this.checked)">
        <label for="hr-sound-live">Sound effects</label>
      </div>
    `,
    actions: [
      { text: 'How to Play', action: () => { closeModal(); showHowToPlay(openSettings); } },
      { text: 'New Game', action: () => {
        closeModal();
        openModal({
          title: 'Abandon current game?',
          body: '<p>Your progress will be lost. Start a brand new game?</p>',
          actions: [
            { text: 'Yes, abandon and restart', primary: true, action: () => {
              clearSave();
              resetTransientGlobals();
              state = null;
              closeModal();
              showScreen('setup-screen');
              renderSetup();
              checkResume();
            }},
            { text: 'Cancel', action: closeModal }
          ]
        });
      } },
      { text: 'Close', action: closeModal }
    ]
  });
}

function toggleSound(on) {
  state.houseRules.sound = on;
  saveGame();
}

function endGameToSetup() {
  clearSave();
  resetTransientGlobals();
  state = null;
  showScreen('setup-screen');
  renderSetup();
  checkResume();
}

// ============================================================
// INIT
// ============================================================

function checkResume() {
  document.getElementById('resume-card').hidden = !hasSave();
}

document.addEventListener('DOMContentLoaded', () => {
  renderSetup();
  checkResume();
  document.getElementById('num-players').addEventListener('change', renderSetup);
  document.getElementById('start-game-btn').addEventListener('click', startGame);
  document.getElementById('how-to-play-btn').addEventListener('click', () => showHowToPlay(null));
  document.getElementById('resume-btn').addEventListener('click', resumeGame);
  document.getElementById('discard-save-btn').addEventListener('click', () => {
    openModal({
      title: 'Start a new game?',
      body: '<p>This will discard your saved game in progress. Continue?</p>',
      actions: [
        { text: 'Yes, start new game', primary: true, action: () => {
          clearSave();
          checkResume();
          closeModal();
          startGame();
        }},
        { text: 'Cancel', action: closeModal }
      ]
    });
  });
  document.getElementById('menu-portfolio').addEventListener('click', openPortfolio);
  document.getElementById('menu-board').addEventListener('click', openBoard);
  document.getElementById('menu-players').addEventListener('click', openPlayers);
  document.getElementById('menu-settings').addEventListener('click', openSettings);
  // Tap anywhere to wake audio on iOS
  document.body.addEventListener('touchstart', () => audio(), { once: true, passive: true });
  document.body.addEventListener('click', () => audio(), { once: true });

  // Register the service worker so the app loads offline once visited, and
  // so iOS/Safari treats it as a real installed app (which makes the
  // localStorage save less likely to be evicted).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Ask the browser to mark our storage as persistent so the save isn't
  // cleared under quota pressure or after periods of inactivity. The browser
  // may grant silently, prompt the user, or decline — all are fine.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
});

// Expose for inline onclicks
window.actMortgage = actMortgage;
window.actUnmortgage = actUnmortgage;
window.actBuildHouse = actBuildHouse;
window.actBuildHotel = actBuildHotel;
window.actSellBuilding = actSellBuilding;
window.rollDice = rollDice;
window.endTurn = endTurn;
window.rollForJail = rollForJail;
window.payToLeave = payToLeave;
window.useGetOutCard = useGetOutCard;
window.toggleSound = toggleSound;
window.endGameToSetup = endGameToSetup;

</script>
