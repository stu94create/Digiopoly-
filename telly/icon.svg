<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1e12"/>
      <stop offset="1" stop-color="#12100c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C3A21"/>
      <stop offset=".5" stop-color="#7A5230"/>
      <stop offset="1" stop-color="#42301c"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E4DECB"/>
      <stop offset="0.6" stop-color="#9a9279"/>
      <stop offset="1" stop-color="#5C563F"/>
    </radialGradient>
    <radialGradient id="glare" cx="0.25" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- TV cabinet (kept within the maskable safe zone) -->
  <rect x="92" y="132" width="328" height="248" rx="30" fill="url(#wood)" stroke="#2f2013" stroke-width="7"/>

  <!-- screen -->
  <rect x="116" y="158" width="236" height="196" rx="22" fill="#0A0A0C"/>
  <rect x="116" y="158" width="236" height="196" rx="22" fill="url(#glare)"/>

  <!-- play triangle -->
  <path d="M210 210 L210 302 L288 256 Z" fill="#4DFF7A"/>

  <!-- side dials -->
  <circle cx="388" cy="198" r="17" fill="url(#dial)" stroke="#2f2013" stroke-width="4"/>
  <circle cx="388" cy="250" r="17" fill="url(#dial)" stroke="#2f2013" stroke-width="4"/>

  <!-- speaker grille -->
  <g fill="#241C10">
    <rect x="372" y="290" width="32" height="6" rx="3"/>
    <rect x="372" y="302" width="32" height="6" rx="3"/>
    <rect x="372" y="314" width="32" height="6" rx="3"/>
    <rect x="372" y="326" width="32" height="6" rx="3"/>
  </g>

  <!-- power LED -->
  <circle cx="240" cy="368" r="6" fill="#FFA733"/>

  <!-- legs -->
  <rect x="150" y="380" width="20" height="26" rx="4" fill="#2b1d10"/>
  <rect x="342" y="380" width="20" height="26" rx="4" fill="#2b1d10"/>
</svg>
